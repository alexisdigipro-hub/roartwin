name: Check RoarTwin

# Every push and pull request: the scripts parse, and the engine finds the right twins among real videos
# (made with ffmpeg: a copy, a re-encode, the same name with another picture, black clips) and texts.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Syntax of every script
        run: |
          for f in electron/*.js electron/tools/*.js test/*.js; do node --check "$f"; done
          for f in app/*.js app/tools/*.js; do node --input-type=module --check < "$f"; done
          node -e "require('./package.json')"
      - name: The engine on real files
        run: npm test
